name: Build and release C3 firmware
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/setup.py
      - run: python3 scripts/test.py
      - run: python3 scripts/build.py
      - name: Package
        run: python3 scripts/package_release.py "${GITHUB_REF_NAME/#main/v0.0.0}"
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
      - uses: actions/upload-artifact@v4
        with:
          name: modem-c3-firmware
          path: |
            dist/
            build/c3/*.bin
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: modem-c3-firmware
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already published; keeping its verified assets."
            exit 0
          fi
          gh release create "$TAG" artifacts/dist/"$TAG"/* --verify-tag --title "Modem Satellite C3 $TAG" --notes-file artifacts/dist/"$TAG"/RELEASE_NOTES.md
